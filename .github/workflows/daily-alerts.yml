name: Daily Vehicle Expiry Alerts (Telegram & WhatsApp)

on:
  schedule:
    # Morning 6:00 AM IST slots (avoids global :00 / :30 GitHub peak queue delays)
    # Slot 1: 00:25 UTC = 05:55 AM IST
    - cron: '25 0 * * *'
    # Slot 2 (Backup): 00:45 UTC = 06:15 AM IST
    - cron: '45 0 * * *'
    # Slot 3 (Backup): 01:15 UTC = 06:45 AM IST
    - cron: '15 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime!

jobs:
  send-alerts:
    name: Check Expiries & Send Alerts (Telegram / WhatsApp)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Channel Alert Runner
        run: node scripts/send-daily-alerts.js
        env:
          # Optional: specify comma-separated keys (e.g. MMM-1407) or leave blank to scan all registered workspaces
          WORKSPACE_KEYS: ${{ secrets.WORKSPACE_KEYS }}
